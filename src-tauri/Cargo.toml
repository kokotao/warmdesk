[package]
name = "warmdesk"
version = "0.2.2"
description = "WarmDesk low-impact desktop warm hand companion"
authors = ["Albert_Luo"]
edition = "2021"

[lib]
name = "warmdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
